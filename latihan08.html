<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Form</title>
</head>
<body>
    <H1>Formulir Pendaftaran</H1>
    <form method="get">
        <label for="nama">Nama Lengkap</label>
        <input type="text" name="" id="nama">
        <br>
        <label for="password">Password</label>
        <br>
        <input type="password" name="" id="password">
        <br>
        <input type="radio" name="gender" id="gender">
        <label for="gender">Laki-laki</label>
        <input type="radio" name="gender" id="gender">
        <label for="gender">Perempuan</label>
        <br>
        <input type="checkbox" name="" id="futsal">
        <label for="futsal">Futsal</label>
        <input type="checkbox" name="" id="beranang">
        <label for="beranang">Berenang</label>
        <input type="checkbox" name="" id="lari">
        <label for="lari">Lari</label>
        <br>
        <label for="kelas">Kelas</label>
        <select name="kelas" id="kelas">
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
        <br>
        <label for="alamat">Alamat</label>
        <br>
        <textarea name="alamat" id="alamat"></textarea>
        <br>
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
